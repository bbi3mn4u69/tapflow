name: tapflow-dev
services:
  db:
    image: postgres:17.11@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_DB: tapflow
      POSTGRES_USER: tapflow
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Set LOCAL_DATABASE_PASSWORD in your local .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - tapflow_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tapflow -d tapflow']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
volumes:
  tapflow_dev_pgdata:
