name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :apps:android-card:assembleDebug :apps:android-pos:assembleDebug :apps:android-card:testDebugUnitTest :apps:android-pos:testDebugUnitTest :apps:android-card:lintDebug :apps:android-pos:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tapflow-debug-apks
          path: apps/android-*/build/outputs/apk/debug/*.apk
