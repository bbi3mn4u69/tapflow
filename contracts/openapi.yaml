---
openapi: 3.1.0
info:
  title: TapFlow Demo API
  version: 0.3.0
  description: DEMO / NO REAL MONEY. Proprietary NFC simulator; no bank-card credentials
    or real transfers. This is the complete v1 contract. At phase 2 authentication,
    identity, merchant metadata and system endpoints run; later operations are implemented
    in the indicated x-implementation-phase. All merchant resources enforce membership
    server-side; cross-tenant resources return 404. Money is integer AUD cents; timestamps
    are UTC.
  contact:
    name: TapFlow project
    url: https://github.com/bbi3mn4u69/tapflow
servers:
- url: "/"
  description: 'Same-origin API. Local server: http://localhost:8080. Deployed environments
    use HTTPS.'
tags:
- name: System
  description: Process, persistence and API documentation.
- name: Authentication
  description: Separate web-cookie and mobile-token sessions.
- name: Cards
  description: Customer-owned device keys and demo wallets.
- name: Merchants
  description: Merchant-scoped views, reports and audit.
- name: Terminals
  description: Single-use pairing and merchant terminal lifecycle.
- name: Payments
  description: Demo authorisation, ledger and owner refunds.
security:
- bearerAuth: []
paths:
  "/health/live":
    get:
      operationId: getLiveness
      summary: Check process liveness
      description: Check process liveness. DEMO / NO REAL MONEY.
      tags:
      - System
      security: []
      x-implementation-phase: 1
      parameters:
      - "$ref": "#/components/parameters/RequestId"
      responses:
        '200':
          description: Successful demo response. DEMO / NO REAL MONEY.
