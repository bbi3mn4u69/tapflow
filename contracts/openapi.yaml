components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access JWT; merchant membership is rechecked against
        the database.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: tapflow_refresh
      description: Rotating opaque HttpOnly web refresh cookie. Origin/Referer and
        CSRF checks apply.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Canonical UUID; malformed values are replaced by a server-generated
        ID.
      schema:
        "$ref": "#/components/schemas/UUID"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4, stable across exact retries. Same key with changed parsed
        payload returns 409. Retained for at least 24 hours.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
      description: Opaque keyset cursor, ordered by created_at DESC and id DESC.
    From:
      name: from
      in: query
      schema:
        "$ref": "#/components/schemas/Timestamp"
      description: Inclusive UTC start; interval at most 366 days.
    To:
      name: to
      in: query
      schema:
        "$ref": "#/components/schemas/Timestamp"
      description: Exclusive UTC end; interval at most 366 days.
    BrowserCsrf:
      name: X-TapFlow-CSRF
      in: header
      required: true
      description: Browser cookie mutation guard. An allowed Origin or Referer origin
        is also required.
      schema:
        type: string
        const: '1'
  headers:
    RequestId:
      description: Server-validated or generated request UUID.
      required: true
      schema:
        "$ref": "#/components/schemas/UUID"
  responses:
    Error:
      description: Safe machine-readable error; requestId also appears in X-Request-ID.
        HTTP status follows the error catalogue. 429 includes Retry-After. No internal
        exceptions or credentials.
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Rate limited. Retry after the indicated number of seconds.
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Seconds before retrying.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
  schemas:
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      pattern: Z$
    AmountMinor:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000
    TotalMinor:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    Currency:
      type: string
      const: AUD
    PaymentStatus:
      type: string
      enum:
      - AWAITING_TAP
      - APPROVED
      - DECLINED
      - EXPIRED
      - CANCELLED
    RefundStatus:
      type: string
      enum:
      - NONE
      - PARTIAL
      - FULL
    DecisionCode:
      type: string
      enum:
      - APPROVED
      - CARD_BLOCKED
      - INSUFFICIENT_FUNDS
    RefundReason:
      type: string
      enum:
      - CUSTOMER_REQUEST
      - DUPLICATE
      - OTHER
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - UNSUPPORTED_CURRENCY
      - INVALID_CARD_PROOF
      - UNAUTHENTICATED
      - INSUFFICIENT_ROLE
      - RESOURCE_NOT_FOUND
      - IDEMPOTENCY_KEY_REUSED
      - INVALID_PAYMENT_STATE
      - REFUND_EXCEEDS_REMAINING
      - TERMINAL_DISABLED
      - PAYMENT_INTENT_EXPIRED
      - RATE_LIMITED
      - INTERNAL_ERROR
      - SERVICE_UNAVAILABLE
      - PAIRING_CODE_INVALID
      - PAIRING_CODE_EXPIRED
      - CARD_ALREADY_ENROLLED
      - CSRF_REJECTED
      - ACCOUNT_ALREADY_EXISTS
    Status:
      type: object
      additionalProperties: false
      required:
      - service
      - phase
      - demo
      properties:
        service:
          type: string
          const: tapflow-api
        phase:
          type: string
          const: authentication
        demo:
          type: boolean
          const: true
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - demo
      properties:
        status:
          type: string
          enum:
          - alive
          - ready
        demo:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - error
      - demo
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - requestId
          - details
          properties:
            code:
              "$ref": "#/components/schemas/ErrorCode"
            message:
              type: string
              maxLength: 512
            requestId:
              "$ref": "#/components/schemas/UUID"
            details:
              type: object
              additionalProperties: true
        demo:
          type: boolean
          const: true
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    MobileRefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 43
          maxLength: 128
          writeOnly: true
    Membership:
      type: object
      additionalProperties: false
      required:
      - merchantId
      - merchantName
      - role
      properties:
        merchantId:
          "$ref": "#/components/schemas/UUID"
        merchantName:
          type: string
          maxLength: 120
        role:
          type: string
          enum:
          - OWNER
          - OPERATOR
    SessionUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - accountType
      - memberships
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
        email:
          type: string
          format: email
        accountType:
          type: string
          enum:
          - CUSTOMER
          - MERCHANT
          - SYSTEM_ADMIN
        memberships:
          type: array
          items:
            "$ref": "#/components/schemas/Membership"
    WebSession:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - expiresInSeconds
      - user
      - demo
      properties:
        accessToken:
          type: string
          minLength: 1
        expiresInSeconds:
          type: integer
          const: 900
        user:
          "$ref": "#/components/schemas/SessionUser"
        demo:
          type: boolean
          const: true
    MobileSession:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - refreshToken
      - expiresInSeconds
      - user
      - demo
      properties:
        accessToken:
          type: string
          minLength: 1
        refreshToken:
          type: string
          minLength: 43
          maxLength: 128
        expiresInSeconds:
          type: integer
          const: 900
        user:
          "$ref": "#/components/schemas/SessionUser"
        demo:
          type: boolean
          const: true
    CardEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
      - label
      - algorithm
      - publicKeySpkiBase64
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        algorithm:
          type: string
          const: P256_SHA256_ECDSA
        publicKeySpkiBase64:
          type: string
          format: byte
          minLength: 64
          maxLength: 1368
          description: X.509 SPKI DER encoding of a P-256 public key only. The private
            key never leaves the device.
    Card:
      type: object
      additionalProperties: false
      required:
      - cardId
      - label
      - status
      - createdAt
      - demo
      properties:
        cardId:
          "$ref": "#/components/schemas/UUID"
        label:
          type: string
          maxLength: 80
        status:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        demo:
          type: boolean
          const: true
    CardList:
      type: object
      additionalProperties: false
      required:
      - items
      - demo
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Card"
        demo:
          type: boolean
          const: true
    Wallet:
      type: object
      additionalProperties: false
      required:
      - cardId
      - balanceMinor
      - currency
      - demo
      properties:
        cardId:
          "$ref": "#/components/schemas/UUID"
        balanceMinor:
          "$ref": "#/components/schemas/TotalMinor"
        currency:
          "$ref": "#/components/schemas/Currency"
        demo:
          type: boolean
          const: true
    WalletEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - entryType
      - amountMinor
      - balanceAfterMinor
      - merchantName
      - paymentId
      - refundId
      - createdAt
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
        entryType:
          type: string
          enum:
          - DEMO_FUNDING
          - DEBIT
          - CREDIT
        amountMinor:
          "$ref": "#/components/schemas/TotalMinor"
        balanceAfterMinor:
          "$ref": "#/components/schemas/TotalMinor"
        merchantName:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
        paymentId:
          anyOf:
          - "$ref": "#/components/schemas/UUID"
          - type: 'null'
        refundId:
          anyOf:
          - "$ref": "#/components/schemas/UUID"
          - type: 'null'
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
    Merchant:
      type: object
      additionalProperties: false
      required:
      - merchantId
      - name
      - slug
      - status
      - demo
      properties:
        merchantId:
          "$ref": "#/components/schemas/UUID"
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 80
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        demo:
          type: boolean
          const: true
    Terminal:
      type: object
      additionalProperties: false
      required:
      - terminalId
      - merchantId
      - label
      - status
      - pairedAt
      - lastSeenAt
      - demo
      properties:
        terminalId:
          "$ref": "#/components/schemas/UUID"
        merchantId:
          "$ref": "#/components/schemas/UUID"
        label:
          type: string
          maxLength: 80
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        pairedAt:
          "$ref": "#/components/schemas/Timestamp"
        lastSeenAt:
          anyOf:
          - "$ref": "#/components/schemas/Timestamp"
          - type: 'null'
        demo:
          type: boolean
          const: true
    PairingCodeRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        labelHint:
          type: string
          maxLength: 80
    PairingCode:
      type: object
      additionalProperties: false
      required:
      - pairingCode
      - merchantId
      - expiresAt
      - demo
      properties:
        pairingCode:
          type: string
          minLength: 13
          maxLength: 13
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
          description: 65 bits of entropy, shown once; expires after 10 minutes and
            is consumed once.
        merchantId:
          "$ref": "#/components/schemas/UUID"
        expiresAt:
          "$ref": "#/components/schemas/Timestamp"
        demo:
          type: boolean
          const: true
    PairTerminalRequest:
      type: object
      additionalProperties: false
      required:
      - pairingCode
      - installationId
      - label
      properties:
        pairingCode:
          type: string
          minLength: 13
          maxLength: 13
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
        installationId:
          "$ref": "#/components/schemas/UUID"
        label:
          type: string
          minLength: 1
          maxLength: 80
    CreateIntentRequest:
      type: object
      additionalProperties: false
      required:
      - terminalId
      - amountMinor
      - currency
      properties:
        terminalId:
          "$ref": "#/components/schemas/UUID"
        amountMinor:
          "$ref": "#/components/schemas/AmountMinor"
        currency:
          "$ref": "#/components/schemas/Currency"
        orderReference:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
    Challenge:
      type: object
      additionalProperties: false
      required:
      - protocolVersion
      - nonceBase64
      - expiresAtEpochMillis
      properties:
        protocolVersion:
          type: integer
          const: 1
        nonceBase64:
          type: string
          format: byte
          minLength: 24
          maxLength: 24
          description: Exactly 16 decoded random bytes.
        expiresAtEpochMillis:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    PaymentIntent:
      type: object
      additionalProperties: false
      required:
      - id
      - merchantId
      - terminalId
      - amountMinor
      - currency
      - status
      - expiresAt
      - createdAt
      - demo
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
        merchantId:
          "$ref": "#/components/schemas/UUID"
        terminalId:
          "$ref": "#/components/schemas/UUID"
        amountMinor:
          "$ref": "#/components/schemas/AmountMinor"
        currency:
          "$ref": "#/components/schemas/Currency"
        status:
          "$ref": "#/components/schemas/PaymentStatus"
        challenge:
          "$ref": "#/components/schemas/Challenge"
        expiresAt:
          "$ref": "#/components/schemas/Timestamp"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        orderReference:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
        decisionCode:
          anyOf:
          - "$ref": "#/components/schemas/DecisionCode"
          - type: 'null'
        demo:
          type: boolean
          const: true
    AuthoriseRequest:
      type: object
      additionalProperties: false
      required:
      - terminalId
      - cardId
      - signatureDerBase64
      properties:
        terminalId:
          "$ref": "#/components/schemas/UUID"
        cardId:
          "$ref": "#/components/schemas/UUID"
        signatureDerBase64:
          type: string
          format: byte
          minLength: 8
          maxLength: 136
          description: ASN.1 DER ECDSA signature, at most 100 decoded bytes. No client-supplied
            amount or nonce is trusted.
    AuthorisationResult:
      type: object
      additionalProperties: false
      required:
      - paymentId
      - status
      - decisionCode
      - amountMinor
      - currency
      - refundedAmountMinor
      - refundStatus
      - merchantName
      - receiptNumber
      - authorisedAt
      - demo
      properties:
        paymentId:
          "$ref": "#/components/schemas/UUID"
        status:
          type: string
          enum:
          - APPROVED
          - DECLINED
        decisionCode:
          "$ref": "#/components/schemas/DecisionCode"
        amountMinor:
          "$ref": "#/components/schemas/AmountMinor"
        currency:
          "$ref": "#/components/schemas/Currency"
        refundedAmountMinor:
          "$ref": "#/components/schemas/TotalMinor"
        refundStatus:
          "$ref": "#/components/schemas/RefundStatus"
        merchantName:
          type: string
          maxLength: 120
        receiptNumber:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
        authorisedAt:
          "$ref": "#/components/schemas/Timestamp"
        demo:
          type: boolean
          const: true
    Refund:
      type: object
      additionalProperties: false
      required:
      - refundId
      - paymentId
      - amountMinor
      - reason
      - createdAt
      properties:
        refundId:
          "$ref": "#/components/schemas/UUID"
        paymentId:
          "$ref": "#/components/schemas/UUID"
        amountMinor:
          "$ref": "#/components/schemas/AmountMinor"
        reason:
          "$ref": "#/components/schemas/RefundReason"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
    PaymentSummary:
      type: object
      additionalProperties: false
      required:
      - paymentId
      - merchantId
      - terminalId
      - terminalLabel
      - amountMinor
      - refundedAmountMinor
      - netAmountMinor
      - refundStatus
      - status
      - decisionCode
      - currency
      - receiptNumber
      - createdAt
      - authorisedAt
      - demo
      properties:
        paymentId:
          "$ref": "#/components/schemas/UUID"
        merchantId:
          "$ref": "#/components/schemas/UUID"
        terminalId:
          "$ref": "#/components/schemas/UUID"
        terminalLabel:
          type: string
          maxLength: 80
        amountMinor:
          "$ref": "#/components/schemas/AmountMinor"
        refundedAmountMinor:
          "$ref": "#/components/schemas/TotalMinor"
        netAmountMinor:
          "$ref": "#/components/schemas/TotalMinor"
        refundStatus:
          "$ref": "#/components/schemas/RefundStatus"
        status:
          "$ref": "#/components/schemas/PaymentStatus"
        decisionCode:
          anyOf:
          - "$ref": "#/components/schemas/DecisionCode"
          - type: 'null'
        currency:
          "$ref": "#/components/schemas/Currency"
        receiptNumber:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        authorisedAt:
          anyOf:
          - "$ref": "#/components/schemas/Timestamp"
          - type: 'null'
        demo:
          type: boolean
          const: true
    RefundRequest:
      type: object
      additionalProperties: false
      required:
      - amountMinor
      - reason
      properties:
        amountMinor:
          "$ref": "#/components/schemas/AmountMinor"
        reason:
          "$ref": "#/components/schemas/RefundReason"
    RefundResult:
      type: object
      additionalProperties: false
      required:
      - refundId
      - paymentId
      - amountMinor
      - currency
      - refundStatus
      - totalRefundedMinor
      - demo
      properties:
        refundId:
          "$ref": "#/components/schemas/UUID"
        paymentId:
          "$ref": "#/components/schemas/UUID"
        amountMinor:
          "$ref": "#/components/schemas/AmountMinor"
        currency:
          "$ref": "#/components/schemas/Currency"
        refundStatus:
          "$ref": "#/components/schemas/RefundStatus"
        totalRefundedMinor:
          "$ref": "#/components/schemas/TotalMinor"
        demo:
          type: boolean
          const: true
    DailyBucket:
      type: object
      additionalProperties: false
      required:
      - date
      - approvedCount
      - grossApprovedMinor
      properties:
        date:
          type: string
          format: date
        approvedCount:
          "$ref": "#/components/schemas/TotalMinor"
        grossApprovedMinor:
          "$ref": "#/components/schemas/TotalMinor"
    Dashboard:
      type: object
      additionalProperties: false
      required:
      - approvedCount
      - declinedCount
      - grossApprovedMinor
      - totalRefundedMinor
      - netApprovedMinor
      - currency
      - from
      - to
      - dailyBuckets
      - recentPayments
      - demo
      properties:
        approvedCount:
          "$ref": "#/components/schemas/TotalMinor"
        declinedCount:
          "$ref": "#/components/schemas/TotalMinor"
        grossApprovedMinor:
          "$ref": "#/components/schemas/TotalMinor"
        totalRefundedMinor:
          "$ref": "#/components/schemas/TotalMinor"
        netApprovedMinor:
          "$ref": "#/components/schemas/TotalMinor"
        currency:
          "$ref": "#/components/schemas/Currency"
        from:
          "$ref": "#/components/schemas/Timestamp"
        to:
          "$ref": "#/components/schemas/Timestamp"
        dailyBuckets:
          type: array
          items:
            "$ref": "#/components/schemas/DailyBucket"
        recentPayments:
          type: array
          items:
            "$ref": "#/components/schemas/PaymentSummary"
        demo:
          type: boolean
          const: true
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - actorUserId
      - merchantId
      - eventType
      - resourceType
      - resourceId
      - details
      - requestId
      - createdAt
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
        actorUserId:
          anyOf:
          - "$ref": "#/components/schemas/UUID"
          - type: 'null'
        merchantId:
          anyOf:
          - "$ref": "#/components/schemas/UUID"
          - type: 'null'
        eventType:
          type: string
          maxLength: 80
        resourceType:
          type: string
          maxLength: 40
        resourceId:
          anyOf:
          - "$ref": "#/components/schemas/UUID"
          - type: 'null'
        details:
          type: object
          additionalProperties: true
          description: Sanitised event metadata. Never tokens, passwords, keys, signatures
            or APDUs.
        requestId:
          "$ref": "#/components/schemas/UUID"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
    PaymentDetail:
      type: object
      additionalProperties: false
      required:
      - paymentId
      - merchantId
      - terminalId
      - terminalLabel
      - amountMinor
      - refundedAmountMinor
      - netAmountMinor
      - refundStatus
      - status
      - decisionCode
      - currency
      - receiptNumber
      - createdAt
      - authorisedAt
      - demo
      - merchantName
      - cardAlias
      - refunds
      properties:
        paymentId:
          "$ref": "#/components/schemas/UUID"
        merchantId:
          "$ref": "#/components/schemas/UUID"
        terminalId:
          "$ref": "#/components/schemas/UUID"
        terminalLabel:
          type: string
          maxLength: 80
        amountMinor:
          "$ref": "#/components/schemas/AmountMinor"
        refundedAmountMinor:
          "$ref": "#/components/schemas/TotalMinor"
        netAmountMinor:
          "$ref": "#/components/schemas/TotalMinor"
        refundStatus:
          "$ref": "#/components/schemas/RefundStatus"
        status:
          "$ref": "#/components/schemas/PaymentStatus"
        decisionCode:
          anyOf:
          - "$ref": "#/components/schemas/DecisionCode"
          - type: 'null'
        currency:
          "$ref": "#/components/schemas/Currency"
        receiptNumber:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        authorisedAt:
          anyOf:
          - "$ref": "#/components/schemas/Timestamp"
          - type: 'null'
        demo:
          type: boolean
          const: true
        merchantName:
          type: string
          maxLength: 120
        cardAlias:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
        refunds:
          type: array
          items:
            "$ref": "#/components/schemas/Refund"
    ActivityPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      - demo
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/WalletEntry"
        nextCursor:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
        demo:
          type: boolean
          const: true
    TerminalPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      - demo
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Terminal"
        nextCursor:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
        demo:
          type: boolean
          const: true
    PaymentPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      - demo
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/PaymentSummary"
        nextCursor:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
        demo:
          type: boolean
          const: true
    AuditPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      - demo
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/AuditEvent"
        nextCursor:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
        demo:
          type: boolean
          const: true
